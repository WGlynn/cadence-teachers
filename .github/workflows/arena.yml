name: arena
# The Teaching Arena v0 (arena/README.md).
#   pull request touching arena/submissions/** : evaluate every added or changed submission, print its score
#                                                (the job fails on an exception or a malformed submission)
#   push to main touching arena/submissions/** or teachers/** : re-evaluate every submission and commit
#                                                arena/leaderboard.json (+ the README table) back to main
# Submission code only ever runs in jobs with a read-only token and no stored git credentials; the job that commits
# runs no submission code.
on:
  pull_request:
    paths: ["arena/submissions/**"]
  push:
    branches: [main]
    paths: ["arena/submissions/**", "teachers/**"]

permissions:
  contents: read

concurrency:
  group: arena-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash            # bash -eo pipefail: a failing evaluation fails the step even when piped through tee

env:
  CADENCE_COMMIT: 19bee92  # Cadence 0.80.0, the version the published experiments and the pilot ran on
  NUMPY_VERSION: "2.4.2"   # the numpy the leaderboard was piloted on; pinned so scores do not drift with numpy
  ARENA_CACHE: .arena-cache

jobs:
  evaluate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install Cadence (pinned commit) and this package
        run: |
          git clone -q https://github.com/muellerberndt/cadence vendor/cadence
          git -C vendor/cadence checkout -q "$CADENCE_COMMIT"
          python -m pip install -q -e vendor/cadence
          python -m pip install -q "numpy==$NUMPY_VERSION"
          python -m pip install -q -e .
      - name: restore trained founders
        uses: actions/cache/restore@v4
        with:
          path: .arena-cache
          key: arena-founders-${{ runner.os }}-${{ env.CADENCE_COMMIT }}-${{ env.NUMPY_VERSION }}-${{ hashFiles('teachers/core.py') }}
      - name: evaluate every added or changed submission
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          export ARENA_WORKERS=$(nproc)    # results do not depend on the worker count (a fresh process per run)
          files=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- 'arena/submissions/*.py')
          if [ -z "$files" ]; then echo "no submission added or changed"; exit 0; fi
          echo "### Arena scores" >> "$GITHUB_STEP_SUMMARY"
          for f in $files; do
            echo "::group::$f"
            python -m teachers.arena run "$f" | tee score.json
            echo "::endgroup::"
            python -c 'import json; e = json.load(open("score.json")); print("- %s track, **%s** (%s): %.4f +- %.4f" % (e["track"], e["name"], e["author"], e["score"], e["sem"]))' | tee -a "$GITHUB_STEP_SUMMARY"
          done

  leaderboard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install Cadence (pinned commit) and this package
        run: |
          git clone -q https://github.com/muellerberndt/cadence vendor/cadence
          git -C vendor/cadence checkout -q "$CADENCE_COMMIT"
          python -m pip install -q -e vendor/cadence
          python -m pip install -q "numpy==$NUMPY_VERSION"
          python -m pip install -q -e .
      - name: cache trained founders
        uses: actions/cache@v4
        with:
          path: .arena-cache
          key: arena-founders-${{ runner.os }}-${{ env.CADENCE_COMMIT }}-${{ env.NUMPY_VERSION }}-${{ hashFiles('teachers/core.py') }}
      - name: re-evaluate every submission
        run: ARENA_WORKERS=$(nproc) python -m teachers.arena leaderboard
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard
          path: |
            arena/leaderboard.json
            arena/README.md
          retention-days: 7

  publish:
    needs: leaderboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: leaderboard
          path: arena
      - name: commit the leaderboard back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arena/leaderboard.json arena/README.md
          if git diff --cached --quiet; then echo "leaderboard unchanged"; exit 0; fi
          git commit -q -m "arena: recompute leaderboard [skip ci]"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
